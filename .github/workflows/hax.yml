name: hax
run-name: "hax ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  fstar-type-checking:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4

      - name: ⤵ Install and configure hax
        uses: hacspec/hax-actions@main
        with:
          fstar: v2025.10.06
          hax_reference: hax-lib-v0.3.7

      - run: sudo apt-get install protobuf-compiler

      - name: 🏃 Extract F*
        run: |
          rm -f proofs/fstar/extraction/*.fst*
          ./hax.py extract
      - name: 🏃 Type-check extracted F*
        run: ./hax.py prove
