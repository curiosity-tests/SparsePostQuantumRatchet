name: hax
run-name: "hax ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  fstar-type-checking:
    runs-on: "ubuntu-latest"

    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: ⤵ Install and configure hax
        uses: hacspec/hax-actions@main
        with:
          fstar: v2025.10.06
          hax_reference: hax-lib-v0.3.7

      - run: sudo apt-get install protobuf-compiler

      - name: 🏃 Extract F*
        run: |
          rm -f proofs/fstar/extraction/*.fst*
          ./hax.py extract
      - name: 🏃 Type-check extracted F*
        run: ./hax.py prove
